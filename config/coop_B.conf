# =============================================================================
# config/coop_B.conf: cấu hình device_sim cho CHUỒNG B
#   - tcp_port khác coop_A để 2 tiến trình chạy cùng lúc trên một máy
#   - udp_port GIỐNG coop_A (tuần 2: chứng minh SO_REUSEADDR/SO_REUSEPORT)
#   - mật khẩu khác để demo kết nối sai mật khẩu
# =============================================================================
tcp_port=7001
udp_port=9999
speed=1

device type=ENV_SENSOR  name=Cam_bien_B1  password=abcdef
device type=EGG_COUNTER name=Dem_trung_B1 password=abcdef capacity=500 rate=20
device type=FEEDER      name=May_an_B1    password=abcdef W=8 times=07:00,16:00
device type=WATERER     name=May_uong_B1  password=abcdef Vw=15
device type=FAN         name=Quat_B1      password=abcdef Tmax=30 Tp1=27
device type=HEATER      name=Den_B1       password=abcdef Tmin=16 Tp2=20
device type=MISTER      name=Phun_B1      password=abcdef Hmin=50 Hp=65 Vh=3
