# =============================================================================
# config/coop_B.conf: cấu hình mẫu cho device_sim thứ hai (chuồng B)
# Người phụ trách: Long · Phase 2 (cần cho kiểm thử quét nhiều tiến trình, mốc M2)
# =============================================================================
#
# VIỆC CẦN LÀM:
#   [ ] Giống coop_A.conf nhưng:
#         - tcp_port=7001 (khác coop_A để hai tiến trình cùng chạy trên một máy)
#         - udp_port=9999 (GIỐNG coop_A, để chứng minh SO_REUSEADDR/SO_REUSEPORT
#           giúp cả hai cùng nghe được cổng quét)
#         - Tên thiết bị khác (Quat_B1, ...) và vài ngưỡng khác để dễ phân biệt khi demo
#         - Mật khẩu khác (vd. "abcdef") để demo sai mật khẩu
#
# Kiểm tra: chạy coop_A và coop_B cùng lúc, quét từ controller thấy 14 thiết bị.
