#   [ ] KHÔNG ghi "id=" ở đây. ID được sinh ngẫu nhiên lần chạy đầu và lưu ở
#       data/devices_coop_A.conf.
#   [ ] Dòng bắt đầu bằng # là chú thích; dòng rỗng bị bỏ qua.
