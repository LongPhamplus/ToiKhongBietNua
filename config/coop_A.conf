# VIỆC CẦN LÀM (sau khi chốt định dạng ở Phase 0):
#   [ ] Viết các dòng cấu hình theo định dạng ở KE_HOACH.md mục 4.4:
#         - 3 dòng thông số tiến trình: tcp_port=7000, udp_port=9999, speed=1
