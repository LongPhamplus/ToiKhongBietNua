# =============================================================================
# config/coop_A.conf: cấu hình device_sim cho CHUỒNG A
#
# Thông số tiến trình:
#   tcp_port : cổng điều khiển TCP
#   udp_port : cổng nghe gói quét SCAN (giống nhau giữa các chuồng)
#   speed    : số phút mô phỏng trôi qua mỗi giây thực
#
# Mỗi dòng "device" là một thiết bị. Bắt buộc có type=. Các key khác không ghi
# thì dùng GIÁ TRỊ MẶC ĐỊNH (KE_HOACH.md bảng 4.1).
# KHÔNG ghi id= : ID được sinh ngẫu nhiên lần chạy đầu và lưu ở data/devices_coop_A.conf.
# Muốn sinh lại từ đầu thì chạy: make reset-data
# =============================================================================
tcp_port=7000
udp_port=9999
speed=1

device type=ENV_SENSOR  name=Cam_bien_1  password=123456
device type=EGG_COUNTER name=Dem_trung_1 password=123456 capacity=300
device type=FEEDER      name=May_an_1    password=123456 W=5 times=06:00,11:00,17:00
device type=WATERER     name=May_uong_1  password=123456
device type=FAN         name=Quat_1      password=123456 Tmax=32 Tp1=28
device type=HEATER      name=Den_1       password=123456
device type=MISTER      name=Phun_1      password=123456 Vh=2
